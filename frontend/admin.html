<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Admin Dashboard - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-secondary" href="login.html">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Admin Dashboard</h1>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">Vendors</div>
            <div class="card-body">
              <p>Pending: <span id="vendorsPending">0</span></p>
              <p>Approved: <span id="vendorsApproved">0</span></p>
              <p>Rejected: <span id="vendorsRejected">0</span></p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">Partners</div>
            <div class="card-body">
              <p>Pending: <span id="partnersPending">0</span></p>
              <p>Approved: <span id="partnersApproved">0</span></p>
              <p>Rejected: <span id="partnersRejected">0</span></p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">Turnover</div>
            <div class="card-body">
              <p>Graphs simulated in frontend demo.</p>
            </div>
          </div>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-header">Recent Registrations</div>
        <div class="card-body">
          <h6>Vendors</h6>
          <ul id="vendorsList" class="list-group mb-3"></ul>
          <h6>Partners</h6>
          <ul id="partnersList" class="list-group"></ul>
        </div>
      </div>
    </main>

    <script>
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function countStatus(list) {
        return {
          pending: list.filter(x => x.status === 'PENDING').length,
          approved: list.filter(x => x.status === 'APPROVED').length,
          rejected: list.filter(x => x.status === 'REJECTED').length,
        };
      }
      function fillCounts() {
        const vendors = getList('vendors');
        const partners = getList('partners');
        const v = countStatus(vendors);
        const p = countStatus(partners);
        document.getElementById('vendorsPending').textContent = v.pending;
        document.getElementById('vendorsApproved').textContent = v.approved;
        document.getElementById('vendorsRejected').textContent = v.rejected;
        document.getElementById('partnersPending').textContent = p.pending;
        document.getElementById('partnersApproved').textContent = p.approved;
        document.getElementById('partnersRejected').textContent = p.rejected;
      }
      function fillLists() {
        const vendors = getList('vendors');
        const partners = getList('partners');
        const vList = document.getElementById('vendorsList');
        const pList = document.getElementById('partnersList');
        vList.innerHTML = '';
        vendors.forEach(v => {
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between';
          li.innerHTML = `<span>${v.ownerName || v.mobile} • ${v.shopType}${v.groceryType?'/'+v.groceryType:''}</span><span class="badge bg-secondary">${v.status}</span>`;
          vList.appendChild(li);
        });
        pList.innerHTML = '';
        partners.forEach(p => {
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between';
          li.innerHTML = `<span>${p.mobile} • ${p.vehicleType}</span><span class="badge bg-secondary">${p.status}</span>`;
          pList.appendChild(li);
        });
      }
      fillCounts();
      fillLists();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
