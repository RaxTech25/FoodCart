<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Staff Dashboard - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-secondary" href="login.html">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Staff Dashboard</h1>

      <div class="row">
        <div class="col-lg-6">
          <div class="card mb-4">
            <div class="card-header">Pending Vendors</div>
            <div class="card-body">
              <ul id="vendorsPending" class="list-group"></ul>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card mb-4">
            <div class="card-header">Pending Partners</div>
            <div class="card-body">
              <ul id="partnersPending" class="list-group"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function saveList(key, list) { localStorage.setItem(key, JSON.stringify(list)); }

      function render() {
        const vendors = getList('vendors').filter(v => v.status === 'PENDING');
        const partners = getList('partners').filter(p => p.status === 'PENDING');

        const vList = document.getElementById('vendorsPending');
        const pList = document.getElementById('partnersPending');
        vList.innerHTML = '';
        pList.innerHTML = '';

        vendors.forEach((v, idx) => {
          const li = document.createElement('li');
          li.className = 'list-group-item';
          li.innerHTML = `
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div><strong>${v.ownerName || v.mobile}</strong></div>
                <div class="small text-muted">${v.shopType}${v.groceryType?'/'+v.groceryType:''}</div>
              </div>
              <div>
                <button class="btn btn-sm btn-outline-success me-2" data-idx="${idx}" data-type="vendor" data-action="approve">Approve</button>
                <button class="btn btn-sm btn-outline-danger" data-idx="${idx}" data-type="vendor" data-action="reject">Reject</button>
              </div>
            </div>
          `;
          vList.appendChild(li);
        });

        partners.forEach((p, idx) => {
          const li = document.createElement('li');
          li.className = 'list-group-item';
          li.innerHTML = `
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div><strong>${p.mobile}</strong></div>
                <div class="small text-muted">${p.vehicleType}</div>
              </div>
              <div>
                <button class="btn btn-sm btn-outline-success me-2" data-idx="${idx}" data-type="partner" data-action="approve">Approve</button>
                <button class="btn btn-sm btn-outline-danger" data-idx="${idx}" data-type="partner" data-action="reject">Reject</button>
              </div>
            </div>
          `;
          pList.appendChild(li);
        });

        document.querySelectorAll('button[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const el = e.currentTarget;
            const idx = parseInt(el.getAttribute('data-idx'));
            const type = el.getAttribute('data-type');
            const action = el.getAttribute('data-action');
            if (type === 'vendor') {
              const list = getList('vendors');
              const pendingIdx = list.findIndex(v => v.status === 'PENDING');
              const target = list.filter(v => v.status === 'PENDING')[idx];
              if (!target) return;
              target.status = action === 'approve' ? 'APPROVED' : 'REJECTED';
              if (action === 'reject') {
                const reason = prompt('Enter rejection reason (mandatory):');
                target.rejectionReason = reason || 'No reason provided';
              }
              saveList('vendors', list);
            } else {
              const list = getList('partners');
              const target = list.filter(p => p.status === 'PENDING')[idx];
              if (!target) return;
              target.status = action === 'approve' ? 'APPROVED' : 'REJECTED';
              if (action === 'approve') target.kitShipped = true;
              if (action === 'reject') {
                const reason = prompt('Enter rejection reason (mandatory):');
                target.rejectionReason = reason || 'No reason provided';
              }
              saveList('partners', list);
            }
            render();
          });
        });
      }

      render();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
