<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Vendor Shop - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-secondary me-2" href="index.html">Dashboard</a>
          <a class="btn btn-outline-secondary me-2" href="products.html">Products</a>
          <a class="btn btn-outline-secondary me-2" href="orders.html">Orders</a>
          <a class="btn btn-outline-secondary" href="../login.html">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Shop Location</h1>
      <div class="card">
        <div class="card-body">
          <form id="form">
            <div class="mb-3">
              <label class="form-label">Shop Name</label>
              <input class="form-control" id="name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="address" required></textarea>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Latitude</label>
                <input class="form-control" id="lat">
              </div>
              <div class="col-md-6">
                <label class="form-label">Longitude</label>
                <input class="form-control" id="lng">
              </div>
            </div>
            <div class="form-check mt-2">
              <input class="form-check-input" type="checkbox" id="authorized">
              <label class="form-check-label" for="authorized">Authorized (licensed shop)</label>
            </div>
            <div class="mt-3 d-flex gap-2">
              <button class="btn btn-outline-secondary" type="button" id="geoBtn">Use My Current Location</button>
              <button class="btn btn-primary" type="submit">Save</button>
            </div>
          </form>
          <div id="message" class="mt-3 small text-muted"></div>
        </div>
      </div>
    </main>

    <script>
      function get(objKey) {
        return JSON.parse(localStorage.getItem(objKey) || 'null');
      }
      function set(objKey, value) {
        localStorage.setItem(objKey, JSON.stringify(value));
      }

      function load() {
        const shop = get('shop') || {};
        document.getElementById('name').value = shop.name || '';
        document.getElementById('address').value = shop.address || '';
        document.getElementById('lat').value = shop.lat ?? '';
        document.getElementById('lng').value = shop.lng ?? '';
        document.getElementById('authorized').checked = !!shop.authorized;
      }

      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const shop = {
          name: document.getElementById('name').value.trim(),
          address: document.getElementById('address').value.trim(),
          lat: parseFloat(document.getElementById('lat').value) || null,
          lng: parseFloat(document.getElementById('lng').value) || null,
          authorized: document.getElementById('authorized').checked,
        };
        set('shop', shop);
        document.getElementById('message').textContent = 'Shop details saved.';
      });

      document.getElementById('geoBtn').addEventListener('click', function() {
        if (!navigator.geolocation) {
          alert('Geolocation not available.');
          return;
        }
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById('lat').value = pos.coords.latitude;
          document.getElementById('lng').value = pos.coords.longitude;
        }, () => alert('Failed to get location'), { enableHighAccuracy: true, timeout: 10000 });
      });

      load();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
