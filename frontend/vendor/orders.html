<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Vendor Orders - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-secondary me-2" href="index.html">Dashboard</a>
          <a class="btn btn-outline-secondary me-2" href="products.html">Products</a>
          <a class="btn btn-outline-secondary me-2" href="shop.html">Shop</a>
          <a class="btn btn-outline-secondary" href="../login.html">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Orders</h1>
      <p class="text-muted small">Accept or reject orders. Orders auto-reject after 5 minutes if not accepted (simulated).</p>
      <div id="message" class="small text-muted mb-2"></div>
      <div class="card">
        <div class="card-body">
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Status</th>
                <th>Total</th>
                <th>Expires</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function saveList(key, list) { localStorage.setItem(key, JSON.stringify(list)); }

      function render() {
        let orders = getList('orders');
        const now = Date.now();
        orders = orders.map(o => {
          if (o.status === 'PENDING' && o.expiresAt && o.expiresAt < now) {
            o.status = 'AUTO_REJECTED';
          }
          return o;
        });
        saveList('orders', orders);

        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';
        orders.forEach(o => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${o.id}</td>
            <td>${o.status}</td>
            <td>₹${o.total.toFixed(2)}</td>
            <td>${o.expiresAt ? new Date(o.expiresAt).toLocaleTimeString() : '-'}</td>
            <td>
              <button class="btn btn-sm btn-outline-success me-2" data-id="${o.id}" data-action="accept" ${o.status!=='PENDING'?'disabled':''}>Accept</button>
              <button class="btn btn-sm btn-outline-danger" data-id="${o.id}" data-action="reject" ${o.status!=='PENDING'?'disabled':''}>Reject</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        document.querySelectorAll('button[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = parseInt(e.currentTarget.getAttribute('data-id'));
            const action = e.currentTarget.getAttribute('data-action');
            const orders = getList('orders');
            const idx = orders.findIndex(x => x.id === id);
            if (idx === -1) return;
            const o = orders[idx];
            if (o.status !== 'PENDING') return;

            if (action === 'accept') {
              o.status = 'VENDOR_ACCEPTED';
              o.acceptedAt = Date.now();
            } else {
              o.status = 'VENDOR_REJECTED';
            }
            orders[idx] = o;
            saveList('orders', orders);
            render();
          });
        });
      }

      render();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
