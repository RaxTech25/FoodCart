<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Vendor Products - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-secondary me-2" href="index.html">Dashboard</a>
          <a class="btn btn-outline-secondary me-2" href="orders.html">Orders</a>
          <a class="btn btn-outline-secondary me-2" href="shop.html">Shop</a>
          <a class="btn btn-outline-secondary" href="../login.html">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Manage Products</h1>
      <div class="card mb-4">
        <div class="card-header">Add Product</div>
        <div class="card-body">
          <form id="addProductForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Name</label>
                <input class="form-control" id="name" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Price (₹)</label>
                <input class="form-control" id="price" placeholder="199.00" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Commission Rate</label>
                <input class="form-control" id="commissionRate" value="0.10" required>
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-md-8">
                <label class="form-label">Image URL (optional)</label>
                <input class="form-control" id="imageUrl">
              </div>
              <div class="col-md-4">
                <label class="form-label">Cutlery Available</label>
                <select class="form-select" id="cutleryAvailable">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
            </div>
            <div class="mt-2">
              <label class="form-label">Description (optional)</label>
              <textarea class="form-control" id="description"></textarea>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Add Product</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Your Products</div>
        <div class="card-body">
          <div id="productsList" class="row g-3"></div>
        </div>
      </div>
    </main>

    <script>
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function saveList(key, list) { localStorage.setItem(key, JSON.stringify(list)); }

      function renderProducts() {
        const products = getList('products');
        const container = document.getElementById('productsList');
        container.innerHTML = '';
        if (products.length === 0) {
          container.innerHTML = '<div class="text-muted">No products yet. Add one above.</div>';
          return;
        }
        products.forEach((p, i) => {
          const col = document.createElement('div');
          col.className = 'col-md-4';
          col.innerHTML = `
            <div class="card h-100">
              ${p.imageUrl ? `<img src="${p.imageUrl}" class="card-img-top" style="height:160px;object-fit:cover;">` : ''}
              <div class="card-body">
                <h5 class="card-title">${p.name}</h5>
                <p class="card-text small">${p.description || ''}</p>
                <p class="card-text"><strong>₹${p.price}</strong> • Commission ${(p.commissionRate*100).toFixed(0)}%</p>
                <p class="card-text small text-muted">Cutlery: ${p.cutleryAvailable ? 'Yes' : 'No'}</p>
              </div>
              <div class="card-footer text-end">
                <button class="btn btn-sm btn-outline-danger" data-idx="${i}" data-action="remove">Remove</button>
              </div>
            </div>
          `;
          container.appendChild(col);
        });

        document.querySelectorAll('button[data-action="remove"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.getAttribute('data-idx'));
            const products = getList('products');
            products.splice(idx, 1);
            saveList('products', products);
            renderProducts();
          });
        });
      }

      document.getElementById('addProductForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const price = parseFloat(document.getElementById('price').value.trim());
        const commissionRate = parseFloat(document.getElementById('commissionRate').value.trim());
        const imageUrl = document.getElementById('imageUrl').value.trim();
        const description = document.getElementById('description').value.trim();
        const cutleryAvailable = document.getElementById('cutleryAvailable').value === 'true';

        const products = getList('products');
        products.push({ id: Date.now(), name, price, commissionRate, imageUrl, description, cutleryAvailable, active: true });
        saveList('products', products);
        e.target.reset();
        document.getElementById('commissionRate').value = '0.10';
        renderProducts();
      });

      renderProducts();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
