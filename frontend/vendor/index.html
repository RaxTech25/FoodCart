<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Vendor Dashboard - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-secondary me-2" href="products.html">Products</a>
          <a class="btn btn-outline-secondary me-2" href="orders.html">Orders</a>
          <a class="btn btn-outline-secondary me-2" href="shop.html">Shop</a>
          <a class="btn btn-outline-secondary" href="../login.html">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Vendor Dashboard</h1>
      <div class="row g-3">
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <div class="small text-muted">Total Orders</div>
              <div class="h5" id="ordersTotal">0</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <div class="small text-muted">Accepted</div>
              <div class="h5" id="ordersAccepted">0</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <div class="small text-muted">Rejected</div>
              <div class="h5" id="ordersRejected">0</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <div class="small text-muted">Earnings (Commission)</div>
              <div class="h5" id="earnings">₹0.00</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function render() {
        const orders = getList('orders');
        const total = orders.length;
        const accepted = orders.filter(o => o.status === 'VENDOR_ACCEPTED' || o.status === 'PARTNER_ASSIGNED' || o.status === 'DELIVERED').length;
        const rejected = orders.filter(o => o.status === 'VENDOR_REJECTED' || o.status === 'AUTO_REJECTED').length;
        const earnings = orders.reduce((acc, o) => acc + (o.vendorEarning || 0), 0);

        document.getElementById('ordersTotal').textContent = total;
        document.getElementById('ordersAccepted').textContent = accepted;
        document.getElementById('ordersRejected').textContent = rejected;
        document.getElementById('earnings').textContent = '₹' + earnings.toFixed(2);
      }
      render();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
