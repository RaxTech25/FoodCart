<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Partner Dashboard - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-secondary" href="../login.html">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Partner Dashboard</h1>
      <div class="card mb-3">
        <div class="card-body">
          <p class="small text-muted">Geofenced login within 5 km of your registered region (simulated).</p>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" id="startBtn">Start Ride</button>
            <button class="btn btn-outline-secondary" id="stopBtn" disabled>Stop Ride</button>
          </div>
          <div id="message" class="mt-2 small text-muted"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Nearby Orders</div>
        <div class="card-body">
          <ul id="ordersList" class="list-group"></ul>
        </div>
      </div>
    </main>

    <script>
      let online = false;
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function saveList(key, list) { localStorage.setItem(key, JSON.stringify(list)); }

      function getLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) return resolve(null);
          navigator.geolocation.getCurrentPosition(
            pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });
      }

      function loadFeed() {
        const orders = getList('orders').filter(o => o.status === 'VENDOR_ACCEPTED' && !o.partnerId);
        const ul = document.getElementById('ordersList');
        ul.innerHTML = '';
        if (orders.length === 0) {
          ul.innerHTML = '<li class="list-group-item text-muted">No orders nearby.</li>';
          return;
        }
        orders.forEach(o => {
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';
          li.innerHTML = `
            <div>
              <div><strong>Order #${o.id}</strong></div>
              <div class="small text-muted">Total: ₹${o.total.toFixed(2)}</div>
            </div>
            <button class="btn btn-sm btn-outline-primary" data-id="${o.id}" data-action="claim">Accept</button>
          `;
          ul.appendChild(li);
        });

        document.querySelectorAll('button[data-action="claim"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = parseInt(e.currentTarget.getAttribute('data-id'));
            const orders = getList('orders');
            const idx = orders.findIndex(x => x.id === id);
            if (idx === -1) return;
            orders[idx].status = 'PARTNER_ASSIGNED';
            orders[idx].partnerId = 'LOCAL-PARTNER';
            saveList('orders', orders);
            loadFeed();
          });
        });
      }

      document.getElementById('startBtn').addEventListener('click', async () => {
        const message = document.getElementById('message');
        const loc = await getLocation();
        if (!loc) {
          message.textContent = 'Enable location to start session.';
          return;
        }
        online = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        message.textContent = 'Session started.';
        loadFeed();
      });

      document.getElementById('stopBtn').addEventListener('click', () => {
        online = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('ordersList').innerHTML = '';
        document.getElementById('message').textContent = 'Session ended.';
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
