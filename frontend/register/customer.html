<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Register Customer - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary" href="../login.html">Login</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Register as Customer</h1>
      <div class="card">
        <div class="card-body">
          <form id="form">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Name</label>
                <input class="form-control" id="name" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Mobile</label>
                <input class="form-control" id="mobile" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select class="form-select" id="gender" required>
                  <option value="">Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-md-4">
                <label class="form-label">Email (optional)</label>
                <input class="form-control" id="email">
              </div>
              <div class="col-md-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm" required>
              </div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Submit</button>
          </form>
          <div id="message" class="mt-3 small text-muted"></div>
        </div>
      </div>
    </main>

    <script>
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function saveList(key, list) { localStorage.setItem(key, JSON.stringify(list)); }
      function ensureUsers() {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        localStorage.setItem('users', JSON.stringify(users));
      }
      function generateCustomerId() {
        return 'CUST-' + Math.floor(100000 + Math.random() * 900000);
      }
      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        ensureUsers();
        const name = document.getElementById('name').value.trim();
        const mobile = document.getElementById('mobile').value.trim();
        const gender = document.getElementById('gender').value;
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirm = document.getElementById('confirm').value.trim();
        const msg = document.getElementById('message');

        if (password !== confirm) {
          msg.textContent = 'Passwords do not match.';
          return;
        }

        const customerId = generateCustomerId();
        const users = getList('users');
        users.push({ username: customerId, password, role: 'CUSTOMER', phone: mobile, email });
        saveList('users', users);

        msg.textContent = `Registered. Your Customer ID: ${customerId}. Welcome message sent (simulated).`;
        e.target.reset();
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
