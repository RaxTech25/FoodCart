<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Register Vendor - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary" href="../login.html">Login</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Register as Vendor</h1>
      <div class="card">
        <div class="card-body">
          <form id="form">
            <div class="mb-3">
              <label class="form-label">Shop Type</label>
              <select class="form-select" id="shopType">
                <option value="RESTAURANT_HOTEL">Restaurant/Hotel</option>
                <option value="PUSH_CART">Push Cart</option>
                <option value="GROCERY">Grocery</option>
              </select>
            </div>
            <div class="mb-3" id="groceryTypeGroup" style="display:none;">
              <label class="form-label">Grocery Type</label>
              <select class="form-select" id="groceryType">
                <option value="">Select</option>
                <option value="SMALL_STORE">Small Store</option>
                <option value="SUPERMARKET">Supermarket</option>
                <option value="HYPERMARKET">Hypermarket</option>
              </select>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="vegetarian">
              <label class="form-check-label" for="vegetarian">Vegetarian</label>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Website (optional)</label>
                <input class="form-control" id="website">
              </div>
              <div class="col-md-6">
                <label class="form-label">Owner Name</label>
                <input class="form-control" id="ownerName" required>
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-md-4">
                <label class="form-label">Email</label>
                <input class="form-control" id="email">
              </div>
              <div class="col-md-4">
                <label class="form-label">Mobile</label>
                <input class="form-control" id="mobile" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Bank Account</label>
                <input class="form-control" id="bankAccount" required>
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-md-4">
                <label class="form-label">Bank IFSC</label>
                <input class="form-control" id="bankIfsc" required>
              </div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Submit</button>
          </form>
          <div id="message" class="mt-3 small text-muted"></div>
        </div>
      </div>

      <div class="alert alert-info mt-3 small">
        After submission, your profile appears in Staff pending list (simulated). Verification may take 24 hours.
      </div>
    </main>

    <script>
      const shopTypeEl = document.getElementById('shopType');
      const groceryTypeGroup = document.getElementById('groceryTypeGroup');
      shopTypeEl.addEventListener('change', () => {
        groceryTypeGroup.style.display = shopTypeEl.value === 'GROCERY' ? '' : 'none';
      });

      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function saveList(key, list) { localStorage.setItem(key, JSON.stringify(list)); }
      function ensureUsers() {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        if (!users.find(u => u.username === 'admin')) {
          users.push({ username: 'admin', password: 'Admin@123', role: 'ADMIN' });
        }
        if (!users.find(u => u.username === 'staff')) {
          users.push({ username: 'staff', password: 'Staff@123', role: 'STAFF' });
        }
        localStorage.setItem('users', JSON.stringify(users));
      }

      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        ensureUsers();
        const data = {
          shopType: document.getElementById('shopType').value,
          groceryType: document.getElementById('groceryType').value || null,
          vegetarian: document.getElementById('vegetarian').checked,
          website: document.getElementById('website').value.trim() || null,
          ownerName: document.getElementById('ownerName').value.trim(),
          email: document.getElementById('email').value.trim(),
          mobile: document.getElementById('mobile').value.trim(),
          bankAccount: document.getElementById('bankAccount').value.trim(),
          bankIfsc: document.getElementById('bankIfsc').value.trim(),
          status: 'PENDING',
          createdAt: Date.now(),
        };
        const vendors = getList('vendors');
        vendors.push(data);
        saveList('vendors', vendors);
        document.getElementById('message').textContent = 'Registration submitted. Verification takes up to 24 hours.';
        e.target.reset();
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
