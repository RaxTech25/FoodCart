<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Register Partner - Frontend Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Food & Grocery</a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary" href="../login.html">Login</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h4 mb-3">Register as Partner</h1>
      <div class="card">
        <div class="card-body">
          <form id="form">
            <div class="mb-3">
              <label class="form-label">Vehicle Type</label>
              <select class="form-select" id="vehicleType">
                <option value="BICYCLE">Bicycle</option>
                <option value="MOTORBIKE">Motorbike</option>
              </select>
            </div>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Email</label>
                <input class="form-control" id="email">
              </div>
              <div class="col-md-4">
                <label class="form-label">Mobile</label>
                <input class="form-control" id="mobile" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Bank Account</label>
                <input class="form-control" id="bankAccount" required>
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-md-4">
                <label class="form-label">Bank IFSC</label>
                <input class="form-control" id="bankIfsc" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Login Region Lat</label>
                <input class="form-control" id="loginLat">
              </div>
              <div class="col-md-4">
                <label class="form-label">Login Region Lng</label>
                <input class="form-control" id="loginLng">
              </div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Submit</button>
          </form>
          <div id="message" class="mt-3 small text-muted"></div>
        </div>
      </div>

      <div class="alert alert-info mt-3 small">
        After submission, your profile appears in Staff pending list (simulated). Verification may take 24 hours.
      </div>
    </main>

    <script>
      function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
      function saveList(key, list) { localStorage.setItem(key, JSON.stringify(list)); }
      function ensureUsers() {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        if (!users.find(u => u.username === 'admin')) {
          users.push({ username: 'admin', password: 'Admin@123', role: 'ADMIN' });
        }
        if (!users.find(u => u.username === 'staff')) {
          users.push({ username: 'staff', password: 'Staff@123', role: 'STAFF' });
        }
        localStorage.setItem('users', JSON.stringify(users));
      }

      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        ensureUsers();
        const data = {
          vehicleType: document.getElementById('vehicleType').value,
          email: document.getElementById('email').value.trim(),
          mobile: document.getElementById('mobile').value.trim(),
          bankAccount: document.getElementById('bankAccount').value.trim(),
          bankIfsc: document.getElementById('bankIfsc').value.trim(),
          loginLat: parseFloat(document.getElementById('loginLat').value) || null,
          loginLng: parseFloat(document.getElementById('loginLng').value) || null,
          status: 'PENDING',
          kitShipped: false,
          kitReceived: false,
          createdAt: Date.now(),
        };
        const partners = getList('partners');
        partners.push(data);
        saveList('partners', partners);
        document.getElementById('message').textContent = 'Registration submitted. Verification takes up to 24 hours.';
        e.target.reset();
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
