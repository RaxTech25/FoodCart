<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Login - Food & Grocery Marketplace (Frontend)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .role-links a { margin-right: .5rem; }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Food & Grocery</a>
        <div class="ms-auto">
          <div class="btn-group">
            <a class="btn btn-outline-secondary" href="register/vendor.html">Register Vendor</a>
            <a class="btn btn-outline-secondary" href="register/partner.html">Register Partner</a>
            <a class="btn btn-outline-secondary" href="register/customer.html">Register Customer</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Login</div>
            <div class="card-body">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input class="form-control" id="username" placeholder="Username">
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" placeholder="Password">
                </div>
                <button class="btn btn-primary" type="submit">Login</button>
              </form>
              <div id="message" class="mt-3 small text-muted"></div>
              <hr>
              <div class="role-links">
                <span>Register as: </span>
                <a class="btn btn-outline-secondary btn-sm" href="register/vendor.html">Vendor</a>
                <a class="btn btn-outline-secondary btn-sm" href="register/partner.html">Partner</a>
                <a class="btn btn-outline-secondary btn-sm" href="register/customer.html">Customer</a>
              </div>
            </div>
          </div>

          <div class="alert alert-info mt-3 small">
            First-time login will simulate OTP. Use default Admin/Staff or register others.
          </div>
        </div>
      </div>
    </main>

    <script>
      // Simulated users in localStorage
      const defaultUsers = [
        { username: 'admin', password: 'Admin@123', role: 'ADMIN' },
        { username: 'staff', password: 'Staff@123', role: 'STAFF' },
      ];
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      if (users.length === 0) {
        localStorage.setItem('users', JSON.stringify(defaultUsers));
      }

      function roleRedirect(role) {
        switch (role) {
          case 'ADMIN': return 'admin.html';
          case 'STAFF': return 'staff.html';
          case 'VENDOR': return 'vendor/index.html';
          case 'PARTNER': return 'partner/index.html';
          case 'CUSTOMER': return 'customer/index.html';
          default: return 'index.html';
        }
      }

      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const message = document.getElementById('message');

        const db = JSON.parse(localStorage.getItem('users') || '[]');
        const found = db.find(u => u.username === username && u.password === password);
        if (!found) {
          message.textContent = 'Invalid username or password.';
          return;
        }

        // Simulate OTP on first login
        const otpRequiredKey = `otpRequired:${username}`;
        const otpRequired = localStorage.getItem(otpRequiredKey);
        if (otpRequired !== 'false') {
          const code = Math.floor(100000 + Math.random() * 900000).toString();
          localStorage.setItem(`otp:${username}`, code);
          localStorage.setItem(otpRequiredKey, 'false');
          message.textContent = `OTP sent (simulated): ${code}. Enter OTP to continue.`;
          setTimeout(() => {
            const entered = prompt('Enter OTP sent to your mobile (simulated):');
            if (entered === code) {
              window.location.href = roleRedirect(found.role);
            } else {
              alert('Invalid OTP');
            }
          }, 300);
          return;
        }

        window.location.href = roleRedirect(found.role);
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
